# Electron Forge 的依赖遍历器要求 npm 式扁平 node_modules，因此使用 hoisted 布局。
nodeLinker: hoisted

# Electron 的安装脚本会下载平台二进制；pnpm 10/11 默认拦截依赖构建脚本。
# onlyBuiltDependencies 供 pnpm 10 读取，allowBuilds 供 pnpm 11 读取，两边保持一致。
onlyBuiltDependencies:
  - electron
  - electron-winstaller
  - esbuild
  - sharp
  - workerd
allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  sharp: true
  workerd: true

# pnpm 11 默认禁止 git 形式的子依赖；@electron/rebuild（Electron Forge 依赖树）
# 通过 git tarball 引用 @electron/node-gyp，且已存在于 pnpm-lock.yaml，需要放行。
blockExoticSubdeps: false
