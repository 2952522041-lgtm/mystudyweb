name: Build Windows Desktop

# 桌面安装包与 Pages 部署分开：普通推送不打包，
# 手动触发或发布 v* tag 时产出 Windows x64 安装程序。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: demo/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run frontend tests
        run: pnpm test
      - name: Run lint
        run: pnpm lint
      - name: Run typecheck
        run: pnpm exec tsc --noEmit
      - name: Build static web assets
        run: pnpm desktop:web
      - name: Compile electron main and preload
        run: pnpm desktop:compile
      - name: Make Windows x64 installer
        run: npx electron-forge make --platform win32 --arch x64
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer
          path: demo/out/make/
          if-no-files-found: error
